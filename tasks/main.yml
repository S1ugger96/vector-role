---
- name: Create vector system group
  ansible.builtin.group:
    name: vector
    state: present
    system: true

- name: Create vector system user
  ansible.builtin.user:
    name: vector
    group: vector
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create directories for vector
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vector
    group: vector
    mode: '0755'
  loop:
    - "{{ vector_config_dir }}"
    - "{{ vector_data_dir }}"
    - "{{ vector_log_dir }}"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
    mode: '0644'

- name: Extract Vector binary
  ansible.builtin.unarchive:
    src: "/tmp/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp"
    remote_src: true

- name: Copy Vector binary to /usr/bin
  ansible.builtin.copy:
    src: "/tmp/vector-x86_64-unknown-linux-musl/bin/vector"
    dest: /usr/bin/vector
    mode: '0755'
    remote_src: true

- name: Template Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: vector
    group: vector
    mode: '0644'
  notify: Restart vector

- name: Template Vector systemd service
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart vector

- name: Ensure vector service is started and enabled
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
